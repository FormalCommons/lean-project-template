name: cache

# Builds the dependencies, Mathlib's files from its cache and the Tau Ceti
# modules that the library imports, which have no cache, and saves them for CI
# to restore. It runs on every push to main, whose code is merged, so no pull
# request can put anything in the cache. GitHub lets runs on any branch
# restore main's caches.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main builds everything an older one would.
concurrency:
  group: cache
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: restore the latest save
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: fetch Mathlib's build cache
        if: steps.restore.outputs.cache-matched-key == ''
        run: lake exe cache get
      - name: build
        run: lake build
      # The key names the set of compiled dependency files, so a new save is
      # made only when the library has started to import new modules.
      - name: name the save
        id: name
        run: |
          files=$(find .lake/packages -name '*.olean' | sort | sha256sum | cut -c1-16)
          echo "key=lake-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-$files" >> "$GITHUB_OUTPUT"
      - name: look for the save
        id: look
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: ${{ steps.name.outputs.key }}
          lookup-only: true
      - name: save the built dependencies
        if: steps.look.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .lake/packages
          key: ${{ steps.name.outputs.key }}
